services:
  backend:
    build: ./backend
    container_name: neyman_backend
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - PYTHONUNBUFFERED=1
    restart: always

  frontend:
    build: ./frontend
    container_name: neyman_frontend
    ports:
      - "3005:3005"
    depends_on:
      - backend
    restart: always

volumes:
  backend_data:
